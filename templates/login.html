<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>发票邮件筛选工具</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: radial-gradient(circle at 20% 15%, #dbeafe 0%, transparent 45%),
                  radial-gradient(circle at 85% 85%, #e0e7ff 0%, transparent 45%),
                  var(--color-bg);
    }
    .login-card {
      background: var(--color-card);
      padding: 44px 40px;
      border-radius: 16px;
      box-shadow: var(--shadow-elevated);
      border: 1px solid var(--color-border);
      text-align: center;
      width: 380px;
    }
    .login-mark {
      width: 44px; height: 44px; margin: 0 auto 18px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--color-primary), #60a5fa);
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 20px; font-weight: 700;
      box-shadow: 0 8px 20px rgba(37, 99, 235, .3);
    }
    .login-card h1 { font-size: 19px; margin: 0 0 10px; letter-spacing: -0.01em; }
    .login-card p { color: var(--color-text-muted); font-size: 13.5px; line-height: 1.7; margin: 0 0 26px; text-align: left; }
    .login-card a.btn { width: 100%; padding: 12px 24px; font-size: 14px; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-mark">邮</div>
    <h1>发票邮件筛选工具</h1>
    <p>用你的 Zoho 邮箱登录一次，填几个筛选条件（跟邮箱搜索框用法一样），运行后命中的邮件会列成表格——有附件的可以逐个下载、打包下载，没附件的也会记录标题，最后统一导出 Excel。</p>
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for m in messages %}
          <div class="flash">{{ m }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}
    <a class="btn" href="{{ url_for('login_zoho') }}">用 Zoho 登录</a>
  </div>
</body>
</html>
